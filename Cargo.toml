[package]
name = "carry"
version = "0.2.0"
edition = "2024"

description = "Context-aware conversion traits Carry and CarryAsync"
license = "MIT"
repository = "https://github.com/liagha/carry"
readme = "README.md"
keywords = ["conversion", "cast", "context", "async"]
categories = ["algorithms"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lib]
name = "carry"
path = "src/lib.rs"
